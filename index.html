<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Celebration Invitation 🎉</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Outfit:wght@300;400;600;700;900&family=Playfair+Display:ital,wght@0,700;1,600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- Music Toggle Floating Button -->
  <button id="musicToggleBtn" class="music-btn" title="Toggle Music">
    <span class="music-icon" id="musicIcon">🔊</span>
    <span class="music-wave">
      <span></span><span></span><span></span><span></span>
    </span>
  </button>

  <!-- VIDEO PRELOADER OVERLAY (9:16 Responsive Fit) -->
  <div id="videoPreloaderOverlay" class="video-preloader-overlay">
    <div class="video-wrapper">
      <video id="preloaderVideo" class="preloader-video" poster="assets/poster.jpg" playsinline webkit-playsinline muted preload="auto">
        <source src="assets/preloader.MP4" type="video/mp4">
        Your browser does not support the video tag.
      </video>

      <!-- Cursive Text Overlay placed directly in the white flap of envelope -->
      <div id="envelopeCursiveOverlay" class="envelope-cursive-overlay">
        <span class="cursive-text">
          <span>Open</span>
          <span>Invitation</span>
        </span>
      </div>
    </div>
  </div>

  <!-- MAIN HERO SECTION (Full-Screen Continuous Playing Video, No Text) -->
  <main id="heroSection" class="hero-section hidden-hero">
    <div class="hero-video-wrapper">
      <video id="heroVideo" class="hero-video" loop playsinline webkit-playsinline preload="auto">
        <source src="assets/hero-bg.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
