<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Celebration Invitation 🎉</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Montserrat:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,600&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

  <!-- Music Toggle Floating Button (Clean SVG Vector Icon) -->
  <button id="musicToggleBtn" class="music-btn" title="Toggle Music">
    <span class="music-icon" id="musicIcon">
      <svg class="svg-speaker-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
      <svg class="svg-speaker-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
    </span>
  </button>

  <!-- Birthday Music Audio Element (Cute Song from YouTube) -->
  <audio id="bgSong" src="assets/birthday-song.mp3" preload="auto" loop></audio>

  <!-- VIDEO PRELOADER OVERLAY (9:16 Responsive Fit) -->
  <div id="videoPreloaderOverlay" class="video-preloader-overlay">
    <div class="video-wrapper">
      <video id="preloaderVideo" class="preloader-video" poster="assets/poster.jpg" playsinline webkit-playsinline muted
        preload="auto">
        <source src="assets/preloader.MP4" type="video/mp4">
        Your browser does not support the video tag.
      </video>

      <!-- Cursive Text Overlay placed directly in the white flap of envelope -->
      <div id="envelopeCursiveOverlay" class="envelope-cursive-overlay">
        <span class="cursive-text">
          <span>Open</span>
          <span>Invitation</span>
        </span>
      </div>
    </div>
  </div>

  <!-- White Glow Flash Overlay for Magical Dreamy Video Transition -->
  <div id="whiteFlashOverlay" class="white-flash-overlay"></div>

  <!-- MAIN HERO SECTION (Full-Screen Continuous Playing Video with Aesthetic Invitation Overlay) -->
  <main id="heroSection" class="hero-section hidden-hero">
    <div class="hero-video-wrapper">
      <video id="heroVideo" class="hero-video" poster="assets/hero-poster.jpg" loop playsinline webkit-playsinline muted
        preload="auto">
        <source src="assets/hero-bg.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>

      <!-- Aesthetic Baby Invitation Overlay Matching The Video & Reference Design -->
      <!-- Aesthetic Baby Invitation Overlay Matching The Reference Image -->
      <div class="hero-invitation-card">

        <!-- Center Character Image Cutout (Baby with Party Hat, Candle #1, Balloons & Ribbon) -->
        <div class="suryansh-cutout-wrap">
          <img src="assets/suryansh.png" alt="Suryansh" class="suryansh-cutout-img">

          <!-- Name positioned directly inside the blue watercolor ribbon banner -->
          <div class="ribbon-name-overlay">
            <span class="ribbon-kid-name">Suryansh</span>
          </div>
        </div>

        <!-- Aesthetic Title - Cursive & Pure Text, Zero Background Box -->
        <div class="aesthetic-party-title">
          1st Birthday Party
        </div>

        <!-- Event Details Card Wrapped with Delicate Dotted Border -->
        <div class="event-card-wrapper">
          <div class="event-details-text">
            <div class="detail-row">
              <span class="detail-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="18" rx="3" ry="3"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
              </span>
              <span class="detail-val">Sunday, 4th October 2026</span>
            </div>

            <!-- Function Time 06:00 PM Onwards as requested -->
            <div class="detail-row time-row">
              <span class="detail-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
              </span>
              <span class="detail-val">06:00 PM Onwards</span>
            </div>

            <div class="detail-row venue-row">
              <span class="detail-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                  <circle cx="12" cy="10" r="3"></circle>
                </svg>
              </span>
              <span class="detail-val venue-text">Kalpana's Murphy, Rawatsar Rd</span>
            </div>
          </div>
        </div>

        <!-- Join Celebration Subtle Button -->
        <button class="celebrate-btn" id="confettiBtn">
          <span>Join Celebration 🎊</span>
        </button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>

</html>
